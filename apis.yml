aid: plerion
name: Plerion
description: >-
  Plerion is an AI-powered cloud security platform that gives teams unified visibility and
  automated remediation across cloud, code, and AI. It covers Cloud Security Posture Management
  (CSPM) for AWS, Azure, GCP, and Kubernetes; Cloud Workload Protection (CWPP) with vulnerability
  and SBOM scanning; Code Security (IaC and SCA scanning for GitHub, GitLab, and Bitbucket); AI
  Security Posture Management (AI-SPM) for Bedrock, OpenAI, and Anthropic deployments; attack-path
  analysis, entitlements analysis, resource access grants, and compliance tracking against
  frameworks like ISO 27001, SOC 2, CIS, and ISMS-P. Plerion exposes a tenant-scoped REST API
  (Bearer API key, regional hosts) plus a cross-platform CLI so teams can query findings, assets,
  risks, vulnerabilities, and compliance posture programmatically.
