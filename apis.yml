- aid: plerion:plerion-aws-integration-api
  name: Plerion AWS integration API
  description: >-
    In order to connect your AWS account to Plerion or update existing account, you will need, <ol>
      <li> <b>CloudFormation Template URL</b>. Retrieve the template from <a href="#tag/AWS-Integration/operation/getCloudformationTemplate">Get
    CloudFormation template</a></li>
      <li> <b>External Id</b> of the tenant. Retrieve the External Id from <a href="#tag/AWS-Integration/operation/getExternalId">Get
    the external id of the tenant</a></li>
      <li> <b>Plerion AWS Account Id</b>. The value will always be <code>588158338731</code></li>
      <li> <b>Temporary Auth Token</b>. Token to be passed to CloudFormation template that auto registers
    the AWS integration. Retrieve the temporary auth token from <a href="#tag/AWS-Integration/operation/createTemporaryToken">Generate
    temporary token for creating AWS integration</a></li>
      <li> <b>Plerion API URL</b>. The value will always be <code>au.api.plerion.com</code></li>
      <li> Select <b>Capabilities</b>. Select CSPM for CSPM only capability or ALL for both CSPM and CWPP
    capability.</li>
      <li> Select <b>KMSKeyAccessMode</b>. When CWPP is enabled, you can choose the KMS Key access mode
    to facilitate Plerion's access to keys for decrypting volumes, images, and lambda code. In the <b>ALL_KEYS</b>
    mode, Plerion is granted access to all KMS keys in the account. However, you have the option to restrict
    access to certain keys by applying the "PlerionAccess: Denied" tag. Alternatively, the <b>SELECTED_KEYS</b>
    mode allows Plerion access solely to the KMS keys that have been tagged with "PlerionAccess: Granted".</li>
    </ol> Passing the parameters to the CloudFormation template will create a new AWS integration or update
    existing integration. <br/><br/>

    <h3><b>Quick Start</b></h3>

    Follow the guide to create a new AWS integration or update existing integration using <code>curl</code>
    command.  <br/> <b>Note:</b> Replace {$PLERION_API_KEY} with your API key. <br/><br/>

    <h4> <b>Create a new AWS Integration</b></h4>

    <pre>
      export PLERION_API_URL=au.api.plerion.com
      export PLERION_API_KEY={$PLERION_API_KEY}
      export PLERION_AWS_ACCOUNT_ID=588158338731
      # Fetch the template URL
      export TEMPLATE_URL=$(curl -s GET  "https://$PLERION_API_URL/v1/tenant/cloudformation-templates?type=AWSAccount"
    -H "Authorization: Bearer $PLERION_API_KEY" | jq -r '.data.templateURL')
      # Generate the temporary auth token
      export TEMP_AUTH_TOKEN=$(curl -s -X POST  "https://$PLERION_API_URL/v1/tenant/integrations/token"
    -H "Authorization: Bearer $PLERION_API_KEY" | jq -r '.data.token')
      # Fetch the external ID
      export EXTERNAL_ID=$(curl -s -X GET  "https://$PLERION_API_URL/v1/tenant/external-id" -H "Authorization:
    Bearer $PLERION_API_KEY" | jq -r '.data.externalId')
      # Create the stack
      export PLERION_STACK_NAME=plerion-aws-integration
      aws cloudformation create-stack --stack-name $PLERION_STACK_NAME --template-url $TEMPLATE_URL --capabilities
    CAPABILITY_NAMED_IAM \
        --parameters ParameterKey=ExternalId,ParameterValue=$EXTERNAL_ID \
          ParameterKey=PlerionAccountId,ParameterValue=$PLERION_AWS_ACCOUNT_ID  \
          ParameterKey=AuthToken,ParameterValue=$TEMP_AUTH_TOKEN \
          ParameterKey=Capabilities,ParameterValue=ALL \
          ParameterKey=KMSKeyAccessMode,ParameterValue="ALL_KEYS" \
          ParameterKey=PlerionURL,ParameterValue=$PLERION_API_URL
      # Wait for the stack to complete
      aws cloudformation wait stack-create-complete --stack-name $PLERION_STACK_NAME
    </pre> <br/><br/> <h4> <b>Update an existing AWS Integration</b></h4>

    <pre>
      export PLERION_API_URL=au.api.plerion.com
      export PLERION_API_KEY={$PLERION_API_KEY}
      export PLERION_AWS_ACCOUNT_ID=588158338731
      # Fetch the template URL
      export TEMPLATE_URL=$(curl -s GET  "https://$PLERION_API_URL/v1/tenant/cloudformation-templates?type=AWSAccount"
    -H "Authorization: Bearer $PLERION_API_KEY" | jq -r '.data.templateURL')
      # Generate the temporary auth token
      export TEMP_AUTH_TOKEN=$(curl -s -X POST  "https://$PLERION_API_URL/v1/tenant/integrations/token"
    -H "Authorization: Bearer $PLERION_API_KEY" | jq -r '.data.token')
      # Fetch the external ID
      export EXTERNAL_ID=$(curl -s -X GET  "https://$PLERION_API_URL/v1/tenant/external-id" -H "Authorization:
    Bearer $PLERION_API_KEY" | jq -r '.data.externalId')
      # Update an existing stack
      export PLERION_STACK_NAME=plerion-aws-integration
      aws cloudformation update-stack --stack-name $PLERION_STACK_NAME --template-url $TEMPLATE_URL --capabilities
    CAPABILITY_NAMED_IAM \
        --parameters ParameterKey=ExternalId,ParameterValue=$EXTERNAL_ID \
          ParameterKey=PlerionAccountId,ParameterValue=$PLERION_AWS_ACCOUNT_ID  \
          ParameterKey=AuthToken,ParameterValue=$TEMP_AUTH_TOKEN \
          ParameterKey=Capabilities,ParameterValue=ALL \
          ParameterKey=KMSKeyAccessMode,ParameterValue="ALL_KEYS" \
          ParameterKey=PlerionURL,ParameterValue=$PLERION_API_URL
      # Wait for the stack to complete
      aws cloudformation wait stack-update-complete --stack-name $PLERION_STACK_NAME
    </pre>
