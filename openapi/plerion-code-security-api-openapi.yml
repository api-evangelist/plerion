      description: Retrieve all the Vulnerabilities for a scanId
      security:
      - APIKey: []
      parameters:
      - $ref: '#/components/parameters/paramAuthHeader'
      - in: header
        name: Content-Type
        description: application/json
        schema:
          type: string
      - in: path
        name: scanId
        description: Scan ID
        schema:
          type: string
        required: true
      - in: query
        name: ids
        description: Filter vulnerabilities based on ids. Accepts a comma-separated list of ids.
        schema:
          type: string
          example:
          - uuid1,uuid2,uuid3
      - in: query
        name: vulnerabilityIds
        description: Filter vulnerabilities based on vulnerability id. Accepts a comma-separated list of vulnerability id.
        schema:
          type: string
          example: CVE-2022-22965,CVE-2022-22966,CVE-2022-22967
      - in: query
        name: severitySources
        description: Filter vulnerabilities based on severitySource. Accepts a comma-separated list of severitySource.
        schema:
          type: string
          example: nvd,github,debian
      - in: query
        name: files
        description: Filter vulnerabilities based on file. Accepts a comma-separated list of file.
        schema:
          type: string
          example: file1,file2
      - in: query
        name: hasKevs
        description: Filter vulnerabilities based on hasKev. Accepts a comma-separated list of boolean value.
        schema:
          type: boolean
          example: true,false
      - in: query
        name: hasExploits
        description: Filter vulnerabilities based on hasExploit. Accepts a comma-separated list of boolean value.
        schema:
          type: boolean
          example: true,false
      - in: query
        name: severityLevels
        description: Filter vulnerabilities based on severity. Accepts a comma-separated list of severity.
        schema:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
          example: CRITICAL,HIGH
      - in: query
        name: sortBy
        description: Sort results by the specified field.
        schema:
          type: string
          enum:
          - id
          - vulnerabilityId
          - severityLevel
          - severitySource
          - hasKev
          - hasExploit
          - file
          - createdAt
          - updatedAt
          example: createdAt
      - in: query
        name: sortOrder
        description: Sort order for the results.
        schema:
          type: string
          enum:
          - asc
          - desc
          example: asc
      - in: query
        name: page
        description: Page number for the results. Accepts a positive integer.
        schema:
          type: integer
          example: 1
      - in: query
        name: perPage
        description: Number of results per page. Accepts a positive integer.
        schema:
          type: integer
          example: 10
      responses:
        '200':
          description: Successful response with the list of vulnerabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '1'
                        createdAt:
                          type: string
                          example: '2023-06-30T06:07:18.797Z'
                        updatedAt:
                          type: string
                          example: '2023-06-30T06:07:18.797Z'
                        tenantId:
                          type: string
                          example: tenant-123
                        organizationId:
                          type: string
                          example: org-456
                        vulnerabilityId:
                          type: string
                          example: CVE-2023-12345
                        description:
                          type: string
                          example: This is a sample vulnerability description.
                        severityLevel:
                          type: string
                          example: HIGH
                        title:
                          type: string
                          example: Sample Vulnerability Title
                        primaryUrl:
                          type: string
                          example: https://example.com/cve/CVE-2023-12345
                        packages:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: sample-package
                              type:
                                type: string
                                example: npm
                              fixedVersion:
                                type: string
                                example: 1.0.1
                              installedVersion:
                                type: string
                                example: 1.0.0
                        publishedDate:
                          type: string
                          example: '2023-06-15'
                        cwes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: '1'
                              name:
                                type: string
                                example: CWE-123
                              cweId:
                                type: string
                                example: CWE-123
                              source:
                                type: string
                                example: MITRE
                              sourceUrl:
                                type: string
                                example: https://example.com/cwe/CWE-123
                              description:
                                type: string
                                example: This is a sample CWE description.
                        hasKev:
                          type: boolean
                          example: true
                        hasExploit:
                          type: boolean
                          example: false
                        knownExploit:
                          oneOf:
                          - type: 'null'
                          - type: object
                            properties:
                              id:
                                type: string
                                example: '1'
                              title:
                                type: string
                                example: Sample Exploit Title
                              description:
                                type: string
                                example: This is a sample exploit description.
                              source:
                                type: string
                                example: MITRE
                              sourceUrl:
                                type: string
                                example: https://example.com/exploit/CVE-2023-12345
                            example:
                              cveID: CVE-2022-22965
                              notes: ''
                              dueDate: '2022-04-25'
                              product: Spring Framework
                              dateAdded: '2022-04-04'
                              vendorProject: VMware
                              requiredAction: Apply updates per vendor instructions.
                              shortDescription: Spring MVC or Spring WebFlux application running on JDK 9+ may be vulnerable to remote code execution (RCE) via data binding.
                              vulnerabilityName: Spring Framework JDK 9+ Remote Code Execution Vulnerability
                        exploits:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: '1'
                              title:
                                type: string
                                example: Sample Exploit Title
                              description:
                                type: string
                                example: This is a sample exploit description.
                              source:
                                type: string
                                example: MITRE
                              sourceUrl:
                                type: string
                                example: https://example.com/exploit/CVE-2023-12345
                        severityLevelValue:
                          type: integer
                          example: 4
                        file:
                          type: string
                          example: /node/CVE-2023-12345/package-lock.json
                  meta:
                    type: object
                    properties:
                      page:
                        type: number
                      perPage:
                        type: number
                      total:
                        type: number
                      hasNextPage:
                        type: boolean
                      hasPreviousPage:
                        type: boolean
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: 'sortBy must be one of the following: id, vulnerabilityId, severityLevel, severitySource, hasKev, hasExploit, file, createdAt, updatedAt'
              examples:
                example-0:
                  summary: Invalid sortBy
                  description: Response when sortBy is invalid
                  value:
                    errors:
                    - message: 'sortBy must be one of the following: id, vulnerabilityId, severityLevel, severitySource, hasKev, hasExploit, file, createdAt, updatedAt'
                example-1:
                  summary: Invalid page
                  description: Response when page is invalid
                  value:
                    errors:
                    - message: page must be a positive integer
                example-2:
                  summary: Invalid perPage
                  description: Response when perPage is invalid
                  value:
                    errors:
                    - message: perPage must be a positive integer less than or equal to 1000
                example-3:
                  summary: sortOrder requires sortBy
                  description: Response when sortBy is not provided to use sortOrder
                  value:
                    errors:
                    - message: sortBy must be provided to use sortOrder
                example-4:
                  summary: Invalid sortOrder
                  description: Response when sortOrder is invalid
                  value:
                    errors:
                    - message: sortOrder must be either asc or desc (case insensitive)
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
components:
  schemas:
    InternalServerErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Internal server error
  parameters:
    paramAuthHeader:
      name: Authorization
      in: header
      description: Bearer API Key. For example, "Bearer {Tenant API Key}"
      required: true
      schema:
        type: string
  securitySchemes:
    APIKey:
      type: http
      scheme: bearer
      bearerFormat: apiKey
      description: Bearer API Key. For example, "Bearer {Tenant API Key}"
