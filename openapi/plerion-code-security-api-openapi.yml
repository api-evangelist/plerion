                          - helm
                          - terraform
                  meta:
                    type: object
                    properties:
                      page:
                        type: number
                      perPage:
                        type: number
                      total:
                        type: number
                      hasNextPage:
                        type: boolean
                      hasPreviousPage:
                        type: boolean
              examples:
                example-0:
                  summary: Found
                  description: Response when scans are found
                  value:
                    data:
                    - id: c056d03d-3f7a-4232-ace0-45403fe28340
