    patch:
      operationId: updateVulnerabilityExemption
      tags:
        - Vulnerabilities
      summary: Update a vulnerability exemption by ID
      description: >-
        Updates a specific vulnerability exemption by its ID. All fields are
        optional for partial updates.
      security:
        - APIKey: []
      parameters:
        - $ref: '#/components/parameters/paramAuthHeader'
        - in: header
          name: Content-Type
          description: application/json
          schema:
            type: string
        - in: path
          name: id
          description: Exemption ID (UUID)
