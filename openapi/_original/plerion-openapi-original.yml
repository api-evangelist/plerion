        Use the list compliance frameworks API to list compliance frameworks
        across the tenant along with the compliance posture for each framework
        as well as the total compliance posture of the tenant.
      security:
        - APIKey: []
      parameters:
        - $ref: '#/components/parameters/paramAuthHeader'
        - in: header
          name: Content-Type
          description: application/json
          schema:
            type: string
        - in: query
          name: custom
          description: >-
            Filter compliance frameworks based on compliance framework type -
            custom or Plerion managed. The supported values are `true` or
            `false`.
          schema:
            type: string
            example: true
      responses:
        '200':
          description: Compliance Frameworks list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      frameworks:
                        type: array
                        items:
                          $ref: '#/components/schemas/ComplianceFrameworkSummary'
                      totalPosture:
                        type: number
                        format: float
                        example: 79.02
        '400':
          $ref: '#/components/responses/400'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/tenant/integrations/{integrationId}/compliance-frameworks/{complianceId}/download:
    get:
      operationId: downloadComplianceFramework
      tags:
        - Compliance frameworks
      summary: Download report
      x-mint:
        metadata:
          title: Download compliance framework report for an integration in a tenant
      description: >-
        Use the download compliance framework API to receive a pre-signed URL to
        download a compliance framework summary report for an integration within
        the tenant. This URL will be valid for 1 hour. To download the report,
        use `curl` or any other tool of your choice. 
      security:
        - APIKey: []
      parameters:
        - $ref: '#/components/parameters/paramAuthHeader'
        - in: header
          name: Content-Type
          description: application/json
          schema:
            type: string
        - in: path
          name: integrationId
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of the integration to get.
          example: c46aa3ee-3d40-4b98-b8ea-e51ed2bf1234
        - in: path
          name: complianceId
          schema:
            type: string
          required: true
          description: >-
            ID of the Compliance Framework to get. This can be retrieved using
            the List Compliance Frameworks API.
          example: CIS-AWSFB-v140
      responses:
        '200':
          description: Pre-signed URL to download a Compliance Framework Summary Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
        '400':
          $ref: '#/components/responses/400'
        '403':
          description: Not authorized to access compliance framework report
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Forbidden
        '404':
          description: >-
            Compliance framework report not found for requested IntegrationId
            and ComplianceId
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/tenant/integrations/{integrationId}/frameworks/{complianceFrameworkId}/reports:
    post:
      operationId: requestComplianceFrameworkReport
      tags:
        - Compliance frameworks
      summary: Request a framework report
      x-mint:
        metadata:
          title: Request a compliance framework report for an integration
      description: >-
        Starts the generation of a compliance framework report for the specified
        integration.

        Once requested, poll using the download report endpoint.
      security:
        - APIKey: []
      parameters:
        - $ref: '#/components/parameters/paramAuthHeader'
        - in: path
          name: integrationId
          schema:
            type: string
            format: uuid
          required: true
          description: UUID of the integration.
          example: 004a3706-ff2e-463c-a20b-133994dbfc2e
        - in: path
          name: complianceFrameworkId
          schema:
            type: string
          required: true
          description: Framework ID (see list compliance frameworks).
          example: CIS-AWSFB-V150
      responses:
        '200':
          description: Queue the creation of the report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - OK
                      message:
                        type: string
                        enum:
                          - Report generation has been initiated
                          - Report is being generated
                          - >-
                            Report was queued less than 5 minutes ago, please
                            wait
                required:
                  - data
        '403':
          description: Not authorized to request this report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Forbidden
        '404':
          description: Integration or compliance framework not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/tenant/usage:
    get:
      operationId: getTenantUsage
      tags:
        - Tenant
      summary: Usage
      x-mint:
        metadata:
          title: Get the usage details of tenant
      description: >-
        Use the get tenant usage API to get the usage details of the tenant. The
        API retrieves the total consumed Plerion units for the tenant for the
        specified period and additional information regarding whether the limit
        has been exceeded.
      security:
        - APIKey: []
      parameters:
        - $ref: '#/components/parameters/paramAuthHeader'
        - in: header
          name: Content-Type
          description: application/json
          schema:
            type: string
        - in: query
          name: date
          description: >-
            Specify the date to get usage for the billing interval that falls on
            that date. If you don't include a date parameter, the API will
            default to using the current date. Accepts date time in the format
            `yyyy-MM-dd`, for example `2023-03-12`.
          schema:
            type: string
            format: date
            example: '2022-02-01'
      responses:
        '200':
          description: Tenant Usage Details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    $ref: '#/components/schemas/TenantUsage'
        '400':
          $ref: '#/components/responses/400'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
