          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '1'
                        createdAt:
                          type: string
                          example: '2023-06-30T06:07:18.797Z'
                        updatedAt:
                          type: string
                          example: '2023-06-30T06:07:18.797Z'
