                    - ACCEPTED_RISK
                    - COMPENSATING_CONTROL
                    - NO_VENDOR_FIX
                    - NOT_IN_USE
                    - OTHER_REASONS
                conditions:
                  type: object
                  anyOf:
                    - required:
                        - vulnerabilityIds
                    - required:
                        - assetGroupIds
                    - required:
                        - assetIds
                    - required:
                        - assetRegions
                    - required:
                        - assetTags
