  /v1/tenant/shiftleft/iac/scan:
    post:
      operationId: postIaCScan
      tags:
        - Code security
      summary: Upload IaC
      x-mint:
        metadata:
          title: Upload Infrastructure as Code for Scanning
      description: >-
        Use Plerion Code security IaC to scan for security vulnerabilities and
        compliance issues.


        Use the following command to upload your IaC files to the Plerion Code
        security IaC scanning queue:


        ```bash

        export PLERION_API_KEY=YOUR_API_KEY

        curl --request POST \
          --location 'https://au.api.plerion.com/v1/tenant/shiftleft/iac/scan?artifactName=YOUR-ARTIFACT-NAME.zip' \
          --header "Authorization: Bearer $PLERION_API_KEY" \
          --header 'Content-Type: application/zip' \
          --data-binary '@/Users/example.user/examples-iac/terraform.zip'
        ```

        Replace `YOUR_API_KEY` with your actual API key and
        `/Users/example.user/examples-iac/terraform.zip` with the actual path to
        your zip file.


        After receiving a 202 message, retrieve the scanId and proceed to check
        the results by repeatedly polling [the findings
        endpoint](/api-reference/code-security/list-findings) with exponential
        backoff until the data field is not empty.


        **This endpoint supports the following public cloud platforms and IaC
        templates:**


        1. Amazon Web Services (AWS)

        2. Microsoft Azure

        3. Google Cloud Platform (GCP)

        4. Kubernetes manifests

        5. Helm charts

        6. Dockerfile definitions

        7. Terraform configurations

        8. Bicep configurations

        9.  Azure Resource Manager (ARM) templates

        10.  CloudFormation templates


        **Please note that this API endpoint has following limitations:**


        1. Maximum file size that can be uploaded is **4.4MB.**


        **To work around these limitations, please consider the following:**


        1. Split your IaC zip archive into smaller zip files and upload them
        individually.

        2. If you are unable to work within these limitations, please contact
        support for assistance.


        Note: If you encounter the error code "x422Z" while using cURL, it's
        possible that the error is related to missing the "@" symbol when
        specifying the file path in the --data or --data-binary option. To
        resolve this error, you should double-check that you have included the
        "@" symbol before the file path when uploading files with cURL.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      security:
        - APIKey: []
      parameters:
        - $ref: '#/components/parameters/paramAuthHeader'
        - in: header
          required: true
          name: Content-Type
          description: application/zip
          schema:
            type: string
        - in: query
          required: true
          name: artifactName
          description: Name of the artifact being scanned (e.g. my-iac.zip)
          schema:
            type: string
            example: my-iac.zip
      responses:
        '202':
          description: Accepted
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                  meta:
                    type: object
                    properties:
                      organizationId:
                        type: string
                      tenantId:
                        type: string
                      scanId:
                        type: string
                      artifactName:
                        type: string
              examples:
                example-0:
                  summary: Accepted
                  description: File accepted for scan.
                  value:
                    data: File uploaded successfully
                    meta:
                      organizationId: ec17a309-6b0a-4911-8d1d-8a5aa0ac4742
                      tenantId: 7934cf6d-fb34-4bda-adde-173a1fa30d9c
                      scanId: 6ddde0c3-690a-aeb3-b237-9724b3e4403c
                      artifactName: my-iac.zip
                example-1:
                  summary: Already Scanned
                  description: File already scanned.
                  value:
                    data: >-
                      The item you are attempting to scan has already been
                      scanned
                    meta:
                      organizationId: ec17a309-6b0a-4911-8d1d-8a5aa0ac4742
                      tenantId: 7934cf6d-fb34-4bda-adde-173a1fa30d9c
                      scanId: 6ddde0c3-690a-aeb3-b237-9724b3e4403c
                      artifactName: my-iac.zip
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                example-0:
                  summary: Forbidden
                  description: >-
                    Description: The user does not have the authentication to
                    access the resource.
                  value:
                    message: Forbidden
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                example-0:
                  summary: Request Entity Too Large
                  description: >-
                    Description: Upload file size exceeds the maximum limit of
                    4.4MB.
                  value:
                    message: Request Entity Too Large
        '415':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
              examples:
                example-0:
                  summary: x415C
                  description: 'Description: Unsupported File Type.'
                  value:
                    errors:
                      - code: x415C
                        message: >-
                          Unsupported File Type. The file you are trying to
                          upload contains content type headers that are not
                          supported by our system.
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: x422D
                        message:
                          type: string
                          example: >-
                            The uploaded file is corrupted and cannot be
                            processed. Please ensure that the file is not
                            damaged or truncated and try again. Reason: <error
                            message>.
              examples:
                example-0:
                  summary: x422D
                  description: >-
                    Description: The uploaded file is corrupted and cannot be
                    processed.
                  value:
                    errors:
                      - code: x422D
                        message: >-
                          The uploaded file is corrupted and cannot be
                          processed. Please ensure that the file is not damaged
                          or truncated and try again. Reason: File is empty.
                example-1:
                  summary: x422Z
                  description: >-
                    Description: The uploaded file does not have a zip
                    extension.
                  value:
                    errors:
                      - code: x422Z
                        message: >-
                          The uploaded file does not have a zip extension.
                          Please ensure that you are uploading a file in zip
                          format and try again.
                example-2:
                  summary: x422B
                  description: >-
                    Description: The uploaded file has invalid signature and
                    cannot be processed.
                  value:
                    errors:
                      - code: x422B
                        message: >-
                          The uploaded file is invalid and cannot be processed.
                          Please ensure that the file is not damaged and/or that
                          the correct content type header is used, then try
                          uploading again.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
              examples:
                example-0:
                  summary: x500F
                  description: >-
                    Description: Some error occurred while scanning the input
                    file.
                  value:
                    errors:
                      - code: x500F
                        message: >-
                          We're sorry, but there was an error processing your
                          request. We were unable to scan the input file. Please
                          try again later or contact our support team for
                          further assistance.
                example-1:
                  summary: InternalServerError
                  description: >-
                    Description: The server encountered an unexpected error
                    while processing the request. Please reach out to our
                    support team for further assistance.
                  value:
                    errors:
                      - code: InternalServerError
                        message: Internal Server Error
